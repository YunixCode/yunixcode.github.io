<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" fill="none">
  <!-- Y Icon with connected nodes -->
  <g>
    <!-- Main Y shape lines -->
    <line x1="12" y1="4" x2="20" y2="18" stroke="#00C853" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="28" y1="4" x2="20" y2="18" stroke="#00C853" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="20" y1="18" x2="20" y2="36" stroke="#00C853" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Branch lines -->
    <line x1="6" y1="10" x2="12" y2="4" stroke="#00C853" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="34" y1="10" x2="28" y2="4" stroke="#00C853" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <!-- Nodes -->
    <circle cx="12" cy="4" r="3" fill="#00C853"/>
    <circle cx="28" cy="4" r="3" fill="#00C853"/>
    <circle cx="20" cy="18" r="3.5" fill="#00C853"/>
    <circle cx="20" cy="36" r="3" fill="#00C853"/>
    <circle cx="6" cy="10" r="2" fill="#00C853" opacity="0.6"/>
    <circle cx="34" cy="10" r="2" fill="#00C853" opacity="0.6"/>
  </g>
  <!-- Text "Yunix Code" -->
  <text x="46" y="27" font-family="Manrope, sans-serif" font-weight="800" font-size="22" fill="white" letter-spacing="-0.5">Yunix Code</text>
</svg>